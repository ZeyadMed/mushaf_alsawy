name: mushaf_alsawy
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.6.1

dependencies:
  audioplayers: ^6.6.0
  cached_network_image: ^3.3.1
  connectivity_plus: ^4.0.1
  dio: ^5.7.0
  easy_localization: ^3.0.7
  equatable: ^2.0.5
  file_picker: ^8.0.0
  firebase_messaging: ^15.1.5
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  flutter_image_compress: ^2.4.0
  # flutter_local_notifications: ^18.0.1
  flutter_screenutil: ^5.9.3
  gap: ^3.0.1
  get_it: ^8.0.2
  go_router: ^15.1.2
  image_picker: ^1.1.2
  internet_connection_checker_plus: ^2.0.0
  logger: ^2.5.0
  lottie: ^3.3.1
  open_file: ^3.2.1
  path_provider: ^2.1.5
  pretty_dio_logger: ^1.4.0
  shared_preferences: ^2.5.3
  shimmer: ^3.0.0
  url_launcher: ^6.3.1

dev_dependencies:

  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.4
  flutter_test:
    sdk: flutter

flutter:

  uses-material-design: true

  fonts:
    - family: UthmanicHafs
      fonts:
        - asset: assets/fonts/UthmanicHafs1Ver18.ttf
    - family: QCF2001
      fonts:
        - asset: assets/fonts/QCF2001.ttf
    - family: QCF4Hafs
      fonts:
        - asset: assets/fonts/QCF4_Hafs_01_W.ttf
    - family: QCFBismillah
      fonts:
        - asset: assets/fonts/QCF_BSML.ttf
    - family: IBM Plex Sans Arabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Thin.ttf
          weight: 100
        - asset: assets/fonts/IBMPlexSansArabic-Light.ttf
          weight: 300
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
  assets:
    - assets/
    - assets/icons/
    - assets/fonts/
    - assets/images/
    - assets/translations/

flutter_assets:
  assets_path: assets/
  output_path: lib/core/style/
  filename: assets.dart

flutter_native_splash:
  color: "#F8F6F0"
  image: assets/images/logo.png
  android: true
  ios: true
  web: false
  android_12:
    color: "#F8F6F0"
    image: assets/images/logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/logo.png
  remove_alpha_ios: false
